[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "raschlab"
version = "0.2.0"
description = "Open-source dichotomous Rasch item analysis with Winsteps-compatible output."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Idzharul Huda" }]
keywords = ["rasch", "item-response-theory", "psychometrics", "winsteps"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=2.0,<3",
    "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
raschlab = "raschlab.cli:main"

[tool.setuptools]
packages = ["raschlab"]
